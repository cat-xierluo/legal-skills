name: PDF Organizer Regression

on:
  pull_request:
    paths:
      - "skills/pdf-organizer/**"
      - ".github/workflows/pdf-organizer-regression.yml"
  push:
    branches: [main]
    paths:
      - "skills/pdf-organizer/**"
      - ".github/workflows/pdf-organizer-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing PDF dependency
        run: python -m pip install -r skills/pdf-organizer/scripts/requirements.txt
      - name: Compile and run synthetic PDF regressions
        run: |
          python -m py_compile skills/pdf-organizer/scripts/pdf_page_refs.py skills/pdf-organizer/scripts/pdf_organizer.py
          python -m unittest discover -s skills/pdf-organizer/scripts -p 'test_*.py' -v
