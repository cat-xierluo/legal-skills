name: Orchestration Runtime Settlement

on:
  pull_request:
    paths:
      - "skills/multi-agent-orchestration/**"
      - ".github/workflows/orchestration-runtime-settlement.yml"
  push:
    branches: [main]
    paths:
      - "skills/multi-agent-orchestration/**"
      - ".github/workflows/orchestration-runtime-settlement.yml"

permissions:
  contents: read

jobs:
  runtime-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare a private verified Node executable
        shell: bash
        run: |
          python3 - <<'PY_NODE'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import stat
          import tempfile

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          source = Path(shutil.which("node")).resolve(strict=True)
          source_info = source.stat()
          if not stat.S_ISREG(source_info.st_mode):
              raise SystemExit("setup-node executable must be a regular file")
          before = digest(source)
          private_bin = Path(tempfile.mkdtemp(prefix="mao-node-", dir=os.environ["RUNNER_TEMP"]))
          private_bin.chmod(0o700)
          target = private_bin / "node"
          shutil.copyfile(source, target)
          target.chmod(0o700)
          copied = digest(target)
          if before != copied or before != digest(source):
              raise SystemExit("Node copy/source SHA256 mismatch")
          target_info = target.lstat()
          if (not stat.S_ISREG(target_info.st_mode) or target_info.st_uid != os.getuid()
                  or target_info.st_mode & 0o022):
              raise SystemExit("private Node executable permissions refused")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(private_bin) + "\n")
          print(f"Node source mode={stat.S_IMODE(source_info.st_mode):04o}; private mode=0700; SHA256={copied}")
          PY_NODE
      - name: Validate runtime and lease evidence with isolated fixtures
        working-directory: skills/multi-agent-orchestration
        run: |
          python3 scripts/test_runtime_settlement.py -v
          python3 scripts/test_provider_lease_runtime.py -v
          python3 scripts/test_pm_runtime_reconcile.py -v
          bash scripts/test-provider-lease.sh
          bash scripts/test-spawn-worker-provider-lease.sh
          bash scripts/test-settle-liveness.sh
          bash scripts/test-settle-command.sh
      - name: Check changed entrypoint syntax
        working-directory: skills/multi-agent-orchestration
        run: |
          bash -n scripts/pm-orchestrate.sh
          python3 -m py_compile scripts/runtime_settlement.py scripts/runtime-reconcile.py scripts/provider-lease.py
      - name: Check continuous Wave readiness before resource creation
        working-directory: skills/multi-agent-orchestration
        run: |
          bash -n scripts/orca-wave-prepare.sh
          python3 -B scripts/test_continuation_readiness.py -v
          bash scripts/test-orca-wave-lifecycle.sh
          bash scripts/test-pm-monitor.sh
      - name: Check closed ZCode recovery and exact failed-attempt adoption
        working-directory: skills/multi-agent-orchestration
        run: |
          env -u LD_LIBRARY_PATH python3 -B scripts/test_zcode_closed_recovery.py -v
          python3 -B scripts/test-zcode-orca-launcher.py
          python3 -B scripts/test_completion_authority.py
          bash scripts/test-completion-authority.sh
          bash scripts/test-pm-reauthorize.sh
      - name: Check business artifact admission and actual file acceptance
        working-directory: skills/multi-agent-orchestration
        run: |
          python3 scripts/test_business_artifact.py
          bash scripts/test-dispatch-value-gate.sh
          bash scripts/test-worker-value-postflight.sh
          bash scripts/test-review-acceptance-gate.sh
          bash scripts/test-spawn-worker-verification.sh
      - name: Check task memory profiles through the complete isolated spawn
        working-directory: skills/multi-agent-orchestration
        run: |
          env -u LD_LIBRARY_PATH python3 -c 'import sys; print(sys.version)'
          bash -n scripts/spawn-worker.sh
          bash -n scripts/spawn-worker-metadata.sh
          bash -n scripts/spawn-worker-launch.sh
          env -u LD_LIBRARY_PATH python3 scripts/test_memory_task_admission.py
          env -u LD_LIBRARY_PATH python3 scripts/test_minimax_memory_admission.py
          env -u LD_LIBRARY_PATH python3 scripts/test_minimax_spawn_integration.py
