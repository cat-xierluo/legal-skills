name: Git Privacy Preflight

on:
  pull_request:
    paths:
      - 'skills/git-workflow/**'
      - 'skills/git-batch-commit/**'
      - '.githooks/**'
      - '.github/workflows/git-privacy.yml'
  push:
    branches: [main]
    paths:
      - 'skills/git-workflow/**'
      - 'skills/git-batch-commit/**'
      - '.githooks/**'
      - '.github/workflows/git-privacy.yml'

permissions:
  contents: read

jobs:
  privacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install message-generator dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Run isolated privacy and identity regressions
        run: |
          python3 -m unittest discover -s skills/git-workflow/scripts -p test_privacy_check.py -v
          bash skills/git-workflow/scripts/test-check-outgoing-identities.sh
          bash skills/git-workflow/scripts/test-identity-audit.sh
          python3 skills/git-workflow/scripts/test-identity-audit-exit.py
          python3 skills/git-workflow/scripts/test-cleanup-audits.py
          python3 skills/git-workflow/scripts/test-scoped-worktree.py
          python3 skills/git-workflow/scripts/test-sparse-worktree-audit.py
          bash skills/git-workflow/scripts/test-pre-worktree-check.sh
          bash skills/git-workflow/scripts/test-accident-recovery.sh
      - name: Compile and validate shell syntax
        run: |
          python3 -m py_compile skills/git-workflow/scripts/privacy_check.py skills/git-workflow/scripts/safe-pr.py skills/git-workflow/scripts/scoped-worktree.py skills/git-workflow/scripts/sparse-worktree-audit.py skills/git-workflow/scripts/test-cleanup-audits.py skills/git-batch-commit/scripts/interactive_commit.py
          bash -n skills/git-workflow/scripts/branch-audit.sh skills/git-workflow/scripts/worktree-audit.sh skills/git-workflow/scripts/safe-push.sh skills/git-workflow/scripts/check-outgoing-identities.sh .githooks/pre-commit .githooks/commit-msg
