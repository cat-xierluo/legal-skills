name: Case Progress Mailing Contract

on:
  pull_request:
    paths:
      - "skills/case-progress/**"
      - "skills/express-tracking/**"
      - ".github/workflows/case-progress-mailing.yml"
  push:
    branches: [main]
    paths:
      - "skills/case-progress/**"
      - "skills/express-tracking/**"
      - ".github/workflows/case-progress-mailing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mailing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Run synthetic mailing CLI regression
        run: python skills/case-progress/scripts/test_case_store_mailing.py
