name: Update README Download Links

# 兜底通道:正常发版时 README 回写由 release.yml 末尾内嵌步骤完成,本 workflow 幂等重跑无害。
#
# 触发设计:
# - workflow_run:release workflow 成功后触发,避开 GITHUB_TOKEN 创建 Release
#   不会级联触发其他 workflow 的防递归限制(release: published 因此从未生效,已移除)
# - workflow_dispatch:手动兜底
# 注意 checkout 显式 ref: main——workflow_run 事件默认 checkout 在触发 run 的
# head SHA(tag 上,detached),git push 会失败
on:
  workflow_run:
    workflows: ["Release Skills (monorepo)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: update-release-download-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 重写版 update-readme.py 从 cwd 自动发现根 README + expert-suites/*/README.md
      # (套件目录不存在时自动降级为仅根 README),统一调用技能内脚本防止逻辑漂移
      - name: Run update-readme script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 skills/release-workflow/scripts/update-readme.py \
            "${{ github.repository }}"

      - name: Commit README (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -d expert-suites ]; then git add expert-suites/*/README.md; fi
          if git diff --cached --quiet; then
            echo "README 与专家套件下载链接无变更"
          else
            git commit -m "docs: 同步 README 与专家套件下载链接到最新 release"
            git push
          fi
