name: Update README Download Links

on:
  workflow_run:
    workflows: ["Release Skills (monorepo)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: update-release-download-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace placeholders with real asset URLs
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skills/release-workflow/scripts/update-readme.py "${GH_REPO}"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md expert-suites; then
              echo "README 与专家套件下载链接无变更"
          else
              git add README.md expert-suites/*/README.md
              git commit -m "docs(expert-suites): 同步下载链接到最新 release"
              git push
          fi
