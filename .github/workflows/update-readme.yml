name: Update README Download Links

# 兜底通道:正常发版时 README 回写由 release.yml 末尾内嵌步骤完成。
#
# 为什么 release: published 在本仓库从未自动触发——release.yml 用内置
# GITHUB_TOKEN 创建 Release,GitHub 防递归机制规定 GITHUB_TOKEN 产生的
# 事件不会级联触发其他 workflow。保留该触发是给将来用 PAT 创建 Release
# 的场景;手动兜底走 workflow_dispatch。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 显式取 main:release 事件默认 checkout 到 tag SHA,README 改动须落在 main
          ref: main
          fetch-depth: 0

      - name: Run update-readme script
        # 统一调用技能内脚本(正则已覆盖 latest/download 占位形式与显式 tag 形式,
        # 幂等、跨仓库安全),不再维护 inline 副本防止两份逻辑漂移
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 skills/release-workflow/scripts/update-readme.py \
            "${{ github.repository }}" \
            README.md

      - name: Commit README (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README 无变更"
          else
            git add README.md
            git commit -m "docs: 同步 README 下载链接到最新 release"
            git push
          fi
