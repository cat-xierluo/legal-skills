name: Release Skills (monorepo)

on:
  push:
    # CalVer + 可选后缀:v2026.06.30 或 v2026.06.30-v2 / v2026.06.30.1 等
    tags: ['v20[0-9][0-9].[0-9][0-9].[0-9][0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2026.06.30 or v2026.06.30-v2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build skill zips
        run: bash skills/release-workflow/scripts/build-zips.sh "${RELEASE_TAG}"

      - name: Build expert-suite zips
        run: bash skills/release-workflow/scripts/build-suite-zips.sh "${RELEASE_TAG}"

      - name: Generate release notes
        # 从 README 自动提取"最近更新"表格 + 项目 notes: 配置,生成结构化 body
        # 优先用 projects.yaml 里的 legal-skills notes: 个性化配置
        # 失败时回退到默认(脚本会按 repo 名生成)
        run: |
          python3 skills/release-workflow/scripts/generate-release-notes.py \
            "${{ github.repository }}" \
            "${RELEASE_TAG}" \
            "legal-skills" || \
          python3 skills/release-workflow/scripts/generate-release-notes.py \
            "${{ github.repository }}" \
            "${RELEASE_TAG}"

      - name: Create release & upload
        uses: softprops/action-gh-release@d99959edae48b5ffffd7b00da66dcdb0a33a52ee  # v2.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Skills Release ${{ env.RELEASE_TAG }}"
          body_path: .release-notes.md
          fail_on_unmatched_files: false
          files: |
            pack-skills/*.zip

      # README 回写内嵌在本 workflow,不依赖 on:release 事件——
      # GITHUB_TOKEN 创建的 Release 不会级联触发其他 workflow(GitHub 防递归机制)
      - name: Checkout main for README sync
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-tree

      # 重写版 update-readme.py 从 cwd 自动发现根 README + expert-suites/*/README.md
      # (套件目录不存在时自动降级为仅根 README,PR 合入前后打 tag 均可工作),
      # 同时刷新整套与成员下载链接(含 suite-* 资产)
      - name: Sync README download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: main-tree
        run: |
          python3 ../skills/release-workflow/scripts/update-readme.py \
            "${{ github.repository }}"

      - name: Commit README (if changed)
        run: |
          cd main-tree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -d expert-suites ]; then git add expert-suites/*/README.md; fi
          if git diff --cached --quiet; then
            echo "README 与专家套件下载链接无变更"
          else
            git commit -m "docs: 同步 README 与专家套件下载链接到最新 release"
            git push
          fi
