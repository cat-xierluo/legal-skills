<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuitAgent 案件看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f4f1ea;
      --bg-secondary: #ece5d6;
      --bg-card: #fffdf8;
      --bg-card-hover: #f7f1e2;
      --border-subtle: #e2dac7;
      --border-accent: rgba(176, 141, 63, 0.45);
      --text-primary: #26211a;
      --text-secondary: #6b6353;
      --text-muted: #9a8f79;
      --accent-primary: #b08d3f;
      --accent-secondary: #8a6d2f;
      --accent-glow: rgba(201, 168, 106, 0.16);
      --status-todo: #b7791f;
      --status-progress: #4a7c9f;
      --status-done: #2f855a;
      --warn-red: #c53030;
      --warn-yellow: #c05621;
      --ok-green: #2f855a;
      --shadow-card: 0 2px 10px rgba(64, 48, 12, 0.07);
      --shadow-float: 0 8px 28px rgba(64, 48, 12, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .main-content {
      margin-left: 320px;
      padding: 32px 40px;
      min-height: 100vh;
      position: relative;
    }

    .main-content::before {
      content: '';
      position: fixed;
      top: 0; left: 320px; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 70% 45% at 18% 0%, rgba(201, 168, 106, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse 55% 40% at 85% 8%, rgba(176, 141, 63, 0.06) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }
    .top-bar h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .top-bar .meta {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .refresh-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      color: var(--accent-secondary);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .refresh-btn:hover { background: var(--accent-glow); transform: translateY(-1px); }
    .refresh-btn:disabled { opacity: 0.5; cursor: wait; }

    /* 期限预警条 */
    .deadline-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }
    .deadline-bar::-webkit-scrollbar { height: 4px; }
    .deadline-bar::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }
    .deadline-item {
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--text-muted);
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 220px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .deadline-item:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
    .deadline-item.red { border-left-color: var(--warn-red); }
    .deadline-item.yellow { border-left-color: var(--warn-yellow); }
    .deadline-item .dl-name { font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; }
    .deadline-item .dl-meta { font-size: 0.72rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    .deadline-item .dl-days { font-weight: 700; }
    .deadline-item.red .dl-days { color: var(--warn-red); }
    .deadline-item.yellow .dl-days { color: var(--warn-yellow); }

    /* ---- 组件设计系统（M6-3）：分段页签 / 按钮 / 焦点 / 空态 ---- */
    button:focus-visible, input:focus-visible, .case-card:focus-visible {
      outline: 2px solid var(--accent-primary); outline-offset: 2px;
    }
    .view-tabs {
      display: inline-flex; gap: 3px; margin-bottom: 22px;
      background: var(--bg-secondary); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 3px;
    }
    .view-tabs button {
      border: none; background: transparent; color: var(--text-muted);
      padding: 7px 22px; border-radius: 9px; cursor: pointer; font-size: 0.9rem;
      font-family: inherit; transition: all .18s cubic-bezier(.4,0,.2,1); white-space: nowrap;
    }
    .view-tabs button:hover { color: var(--text-secondary); }
    .view-tabs button.on {
      color: var(--accent-secondary); font-weight: 700; background: var(--bg-card);
      box-shadow: var(--shadow-card);
    }
    .view-panel { display: none; }
    .view-panel.on { display: block; animation: fadeUp .22s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

    .refresh-btn, .d-back, .cal-nav button, .stale-chip {
      transition: all .16s cubic-bezier(.4,0,.2,1);
    }
    .refresh-btn:hover, .d-back:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
    .refresh-btn:active, .cal-nav button:active, .view-tabs button:active { transform: scale(0.97); }
    .empty-hint {
      font-size: 0.78rem; color: var(--text-muted); text-align: center; padding: 18px 12px;
      border: 1.5px dashed var(--border-subtle); border-radius: 10px; background: var(--bg-card);
    }

    /* ---------- 今日焦点 ---------- */
    .focus-sec { margin-bottom: 26px; }
    .focus-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .focus-title .cnt { font-size: 0.75rem; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 0 8px; color: var(--text-muted); }
    .hearing-row {
      display: flex; align-items: center; gap: 14px; background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--status-progress); border-radius: 10px; padding: 11px 16px; margin-bottom: 8px;
      cursor: pointer; transition: all .18s;
    }
    .hearing-row:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
    .hearing-date { min-width: 96px; }
    .hearing-date b { display: block; font-size: 0.95rem; }
    .hearing-date span { font-size: 0.72rem; color: var(--text-muted); }
    .hearing-body { flex: 1; font-size: 0.88rem; }
    .hearing-body .h-case { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }
    .stale-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .stale-chip {
      background: var(--bg-card); border: 1px dashed var(--warn-yellow); border-radius: 999px;
      padding: 6px 16px; font-size: 0.82rem; cursor: pointer; transition: all .15s;
    }
    .stale-chip:hover { background: var(--bg-card-hover); }
    .stale-chip b { color: var(--warn-yellow); }

    /* ---------- 案件工具栏（过滤 + 搜索） ---------- */
    .cases-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .chip {
      border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-secondary);
      border-radius: 999px; padding: 4px 14px; font-size: 0.8rem; cursor: pointer; font-family: inherit;
      transition: all .15s;
    }
    .chip:hover { color: var(--text-primary); }
    .chip.on { border-color: var(--accent-primary); color: var(--accent-secondary); background: var(--accent-glow); font-weight: 600; }
    .toolbar-search {
      margin-left: auto; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 9px;
      color: var(--text-primary); padding: 5px 13px; font-size: 0.85rem; font-family: inherit; width: 200px;
    }
    .toolbar-search:focus { outline: none; border-color: var(--border-accent); }

    /* 案件卡升级：徽章行 */
    .case-badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
    .cbadge { font-size: 0.7rem; border-radius: 6px; padding: 2px 8px; border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-secondary); }
    .cbadge.hearing { border-color: rgba(74,124,159,.45); color: #4a7c9f; }
    .cbadge.red { border-color: rgba(239,68,68,.5); color: var(--warn-red); font-weight: 600; }
    .cbadge.stale { border-color: rgba(234,179,8,.5); color: var(--warn-yellow); }
    .closed-group { margin-top: 26px; }
    .closed-head {
      display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-muted);
      font-size: 0.85rem; padding: 10px 4px; border-top: 1px dashed var(--border-subtle);
    }
    .closed-head:hover { color: var(--text-secondary); }
    .closed-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 12px; }
    .case-card.closed { opacity: 0.62; }
    .case-card.closed:hover { opacity: 0.9; }

    /* ---------- 案件详情页 ---------- */
    .d-back {
      border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-secondary);
      border-radius: 8px; padding: 5px 16px; cursor: pointer; font-size: 0.85rem; font-family: inherit; margin-bottom: 16px;
    }
    .d-back:hover { color: var(--text-primary); border-color: var(--border-accent); }
    .d-head { margin-bottom: 4px; }
    .d-head h2 { font-size: 1.35rem; margin-bottom: 6px; }
    .d-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 18px; display: flex; gap: 16px; flex-wrap: wrap; }
    .d-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 20px; overflow-x: auto; }
    .d-tabs button {
      border: 0; background: none; color: var(--text-muted); padding: 8px 16px 10px; cursor: pointer;
      font-size: 0.9rem; font-family: inherit; border-bottom: 2.5px solid transparent; white-space: nowrap;
    }
    .d-tabs button.on { color: var(--accent-secondary); font-weight: 700; border-color: var(--accent-primary); }
    .d-sec { display: none; }
    .d-sec.on { display: block; }
    .d-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .d-card h4 { font-size: 0.92rem; color: var(--accent-secondary); margin-bottom: 12px; border-left: 3px solid var(--accent-primary); padding-left: 9px; }
    .d-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 18px; font-size: 0.88rem; }
    .d-grid b { display: block; font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-bottom: 2px; }
    .d-tag { display: inline-block; font-size: 0.72rem; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 1px 8px; color: var(--text-secondary); margin-right: 8px; }
    .d-people { list-style: none; padding: 0; }
    .d-people li { padding: 6px 0; border-bottom: 1px dashed var(--border-subtle); font-size: 0.88rem; }
    .d-people li:last-child { border: 0; }
    .d-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .d-table th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 0.78rem; padding: 6px 9px; border-bottom: 1px solid var(--border-subtle); }
    .d-table td { padding: 7px 9px; border-bottom: 1px solid var(--border-subtle); }
    .d-kan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 900px) { .d-kan { grid-template-columns: 1fr; } }
    .d-kcol { background: var(--bg-secondary); border-radius: 10px; padding: 10px; }
    .d-kcol h5 { margin: 2px 4px 10px; font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    .d-tcard { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 9px 12px; margin-bottom: 8px; cursor: pointer; font-size: 0.85rem; }
    .d-tcard:hover { border-color: var(--border-accent); }
    .d-tcard.done .tt { color: var(--text-muted); text-decoration: line-through; }
    .d-tcard .tm { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
    .d-dlwrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
    .d-dlcard { display: flex; gap: 13px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-left-width: 4px; border-radius: 10px; padding: 12px 14px; }
    .d-dlcard.red { border-left-color: var(--warn-red); }
    .d-dlcard.yellow { border-left-color: var(--warn-yellow); }
    .d-dlcard.green { border-left-color: var(--ok-green); }
    .d-dlcard.none { opacity: 0.65; }
    .d-dlnum { min-width: 60px; text-align: center; align-self: center; }
    .d-dlnum b { font-size: 1.4rem; display: block; }
    .d-dlnum span { font-size: 0.7rem; color: var(--text-muted); }
    .d-tl { position: relative; margin-left: 8px; padding-left: 24px; }
    .d-tl:before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border-subtle); }
    .d-tl-i { position: relative; padding-bottom: 16px; }
    .d-tl-i:before { content: ''; position: absolute; left: -23px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-primary); box-shadow: 0 0 0 3px var(--bg-primary); }
    .d-tl-i.todo:before { background: var(--bg-primary); border: 2.5px solid var(--accent-primary); width: 7px; height: 7px; }
    .d-tl-d { font-weight: 600; font-size: 0.88rem; }
    .d-tl-e { font-size: 0.72rem; color: var(--accent-secondary); margin-right: 8px; }
    .d-tl-t { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }

    /* 月历 */
    .cal-wrap { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 18px 20px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-head h3 { margin: 0; font-size: 1.05rem; }
    .cal-nav { display: flex; gap: 8px; }
    .cal-nav button {
      border: 1px solid var(--border-subtle); background: transparent; color: var(--text-muted);
      border-radius: 8px; padding: 4px 14px; cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .cal-nav button:hover { color: var(--accent-secondary); border-color: var(--border-accent); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { text-align: center; font-size: 0.75rem; color: var(--text-muted); padding: 4px 0; }
    .cal-cell {
      min-height: 86px; background: var(--bg-secondary); border:  1px solid var(--border-subtle); border-radius: 9px;
      padding: 6px 7px; position: relative; overflow: hidden; cursor: default;
    }
    .cal-cell.other { opacity: 0.35; }
    .cal-cell.today { border-color: var(--accent-primary); box-shadow: 0 0 0 1.5px var(--accent-glow); }
    .cal-num { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    .cal-cell.today .cal-num { color: var(--accent-secondary); }
    .cal-ev {
      display: block; font-size: 0.68rem; line-height: 1.35; border-radius: 5px; padding: 1.5px 6px;
      margin-top: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cal-ev.hearing { background: rgba(74, 124, 159, .13); color: #4a7c9f; border: 1px solid rgba(74,124,159,.35); font-weight: 600; }
    .cal-ev.deadline { background: var(--bg-card); border: 1px solid var(--border-subtle); }
    .cal-ev.red { border-left: 3px solid var(--warn-red); }
    .cal-ev.yellow { border-left: 3px solid var(--warn-yellow); }
    .cal-ev.green { border-left: 3px solid var(--ok-green, #48bb78); }
    .cal-more { font-size: 0.65rem; color: var(--text-muted); margin-top: 3px; }
    .cal-legend { display: flex; gap: 18px; margin-top: 14px; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }
    .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

    /* 案件卡片网格 */
    .case-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      position: relative;
      z-index: 1;
    }
    .case-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .case-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .case-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .case-card-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
    }
    .case-cause {
      font-size: 0.75rem;
      color: var(--accent-secondary);
      margin-bottom: 12px;
    }
    .status-badge {
      font-size: 0.65rem;
      padding: 3px 9px;
      border-radius: 10px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
    }
    .case-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }
    .case-progress {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar {
      width: 70px;
      height: 4px;
      background: var(--bg-primary);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--status-todo), var(--status-done));
      transition: width 0.4s ease;
    }
    .quality-tag {
      font-size: 0.62rem;
      padding: 2px 7px;
      border-radius: 8px;
    }
    .quality-tag.full { background: rgba(16, 185, 129, 0.12); color: var(--status-done); }
    .quality-tag.partial { background: rgba(245, 158, 11, 0.12); color: var(--status-todo); }
    .quality-tag.minimal { background: rgba(90, 90, 110, 0.2); color: var(--text-muted); }

    /* 案件详情展开 */
    .case-detail {
      grid-column: 1 / -1;
      background: var(--bg-secondary);
      border: 1px solid var(--border-accent);
      border-radius: 14px;
      padding: 20px 24px;
      margin-top: -8px;
    }
    .detail-section { margin-bottom: 16px; }
    .detail-section h4 {
      font-size: 0.78rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .detail-tasks { display: flex; flex-direction: column; gap: 6px; }
    .detail-task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .detail-task:hover { border-color: var(--border-accent); }
    .detail-task.done .detail-task-title { color: var(--text-muted); text-decoration: line-through; }
    .detail-task .chk {
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--text-muted);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
    }
    .detail-task.done .chk { background: var(--status-done); border-color: var(--status-done); color: #fff; }
    .detail-task.readonly { cursor: not-allowed; opacity: 0.75; }
    .detail-task.readonly:hover { border-color: var(--border-subtle); }
    .detail-task-title { flex: 1; }
    .detail-task-src {
      font-size: 0.62rem;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .detail-timeline { display: flex; flex-direction: column; gap: 4px; }
    .detail-timeline-item {
      font-size: 0.76rem;
      color: var(--text-secondary);
      padding-left: 14px;
      border-left: 2px solid var(--border-subtle);
      position: relative;
    }
    .detail-timeline-item::before {
      content: '';
      position: absolute;
      left: -3px; top: 7px;
      width: 4px; height: 4px;
      background: var(--accent-primary);
      border-radius: 50%;
    }
    .detail-timeline-item .tl-date { color: var(--accent-secondary); margin-right: 8px; font-weight: 500; }

    /* ==================== 侧边固定看板 ==================== */
    .sidebar-kanban {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 300px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: var(--shadow-float);
    }
    .kanban-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      overflow: hidden;
    }
    .kanban-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #c9a86a, var(--accent-primary) 55%, #8a6d2f);
    }
    .kanban-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .kanban-header h2::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(201, 168, 106, 0.55);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }
    .kanban-header .subtitle { font-size: 0.75rem; color: var(--text-muted); font-weight: 300; }

    .kanban-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border-subtle);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }
    .stat-item { background: var(--bg-secondary); padding: 12px 8px; text-align: center; }
    .stat-item .count { font-size: 1.5rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .stat-item.todo .count { color: var(--status-todo); }
    .stat-item.progress .count { color: var(--status-progress); }
    .stat-item.done .count { color: var(--status-done); }
    .stat-item .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* ---- 待办流（M6-1：替代三列看板） ---- */
    .task-flow { flex: 1; overflow-y: auto; padding: 14px 16px 20px; }
    .task-flow::-webkit-scrollbar { width: 4px; }
    .task-flow::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }
    .tf-sec { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted);
              text-transform: uppercase; margin: 14px 2px 8px; display: flex; justify-content: space-between; }
    .tf-item {
      display: flex; align-items: center; gap: 9px; background: var(--bg-card);
      border: 1px solid var(--border-subtle); border-radius: 9px;
      padding: 9px 11px; margin-bottom: 7px; cursor: pointer; transition: all .16s ease; position: relative;
    }
    .tf-item:hover { border-color: var(--border-accent); transform: translateX(3px); box-shadow: var(--shadow-card); }
    .tf-item.readonly { opacity: 0.6; cursor: not-allowed; }
    .tf-item.readonly:hover { transform: none; box-shadow: none; }
    .tf-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tf-dot.in_progress { background: var(--status-progress); }
    .tf-dot.todo { background: var(--status-todo); }
    .tf-dot.done { background: var(--status-done); }
    .tf-body { flex: 1; min-width: 0; }
    .tf-title { font-size: 0.83rem; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tf-item.done .tf-title { color: var(--text-muted); text-decoration: line-through; }
    .tf-case { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tf-chip { font-size: 0.64rem; border-radius: 6px; padding: 2px 6px; flex-shrink: 0; border: 1px solid var(--border-subtle); color: var(--text-muted); }
    .tf-chip.red { border-color: rgba(197,48,48,.4); color: var(--warn-red); font-weight: 600; }
    .tf-chip.soon { border-color: rgba(192,86,33,.4); color: var(--warn-yellow); }
    .tf-file {
      flex-shrink: 0; border: 1px solid var(--border-subtle); background: var(--bg-secondary);
      border-radius: 7px; width: 26px; height: 26px; font-size: 0.8rem; line-height: 1;
      cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .tf-file:hover { border-color: var(--border-accent); color: var(--accent-primary); background: var(--accent-glow); }
    .tf-done-head {
      font-size: 0.74rem; color: var(--text-muted); text-align: center; padding: 8px;
      cursor: pointer; border-radius: 8px; border: 1px dashed var(--border-subtle); margin-top: 10px;
    }
    .tf-done-head:hover { color: var(--text-secondary); border-color: var(--border-accent); }

    .kanban-column {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      animation: slideIn 0.4s ease forwards;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .column-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .column-title .dot { width: 8px; height: 8px; border-radius: 50%; }
    .column-todo .dot { background: var(--status-todo); }
    .column-progress .dot { background: var(--status-progress); }
    .column-done .dot { background: var(--status-done); }
    .column-count { font-size: 0.7rem; color: var(--text-muted); background: var(--bg-primary); padding: 2px 8px; border-radius: 10px; }

    .task-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 11px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.3s ease forwards;
    }
    .task-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .task-card:hover { transform: translateX(4px); border-color: var(--border-accent); box-shadow: var(--shadow-card); }
    .task-card:hover::before { opacity: 1; }
    .column-todo .task-card::before { background: var(--status-todo); }
    .column-progress .task-card::before { background: var(--status-progress); }
    .column-done .task-card::before { background: var(--status-done); }
    .task-card:last-child { margin-bottom: 0; }
    .task-card.readonly { opacity: 0.6; cursor: not-allowed; }
    .task-card.readonly:hover { transform: none; }
    .task-title {
      font-size: 0.82rem;
      font-weight: 400;
      line-height: 1.4;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .task-card.done .task-title { color: var(--text-muted); text-decoration: line-through; }
    .task-case {
      font-size: 0.66rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .task-case::before { content: '@'; opacity: 0.6; }
    .task-card.readonly .task-case::after { content: ' · 只读'; opacity: 0.6; }

    .empty-hint { font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 16px 8px; opacity: 0.6; }

    /* Toast */
    .toast-wrap {
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: var(--bg-secondary);
      border: 1px solid var(--border-accent);
      border-left: 3px solid var(--accent-primary);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 0.82rem;
      box-shadow: var(--shadow-float);
      animation: toastIn 0.3s ease;
      max-width: 360px;
    }
    .toast.warn { border-left-color: var(--warn-yellow); }
    .toast.error { border-left-color: var(--warn-red); }
    .toast.ok { border-left-color: var(--status-done); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .loading { text-align: center; color: var(--text-muted); padding: 40px; font-size: 0.85rem; }

    /* 移动端 */
    @media (max-width: 768px) {
      .sidebar-kanban { width: 100%; height: auto; max-height: 45vh; top: auto; bottom: 0; border-right: none; border-top: 1px solid var(--border-subtle); border-radius: 20px 20px 0 0; }
      .main-content { margin-left: 0; padding: 20px; padding-bottom: 50vh; }
      .kanban-columns { flex-direction: row; overflow-x: auto; }
      .kanban-column { min-width: 260px; flex-shrink: 0; }
    }
  </style>
</head>
<body>

  <!-- 侧边固定看板 -->
  <aside class="sidebar-kanban">
    <div class="kanban-header">
      <h2>案件看板</h2>
      <span class="subtitle">SuitAgent · 全局任务池</span>
    </div>

    <div class="kanban-stats">
      <div class="stat-item progress"><div class="count" id="stat-progress">–</div><div class="label">进行中</div></div>
      <div class="stat-item todo"><div class="count" id="stat-todo">–</div><div class="label">待办</div></div>
      <div class="stat-item done"><div class="count" id="stat-done">–</div><div class="label">已完成</div></div>
    </div>

    <div class="task-flow" id="task-flow"></div>
  </aside>

  <!-- 主内容区域 -->
  <main class="main-content">
    <div class="top-bar">
      <h1>案件管理</h1>
      <div class="meta">
        <span id="updated-time"></span>
        <button class="refresh-btn" id="refresh-btn" onclick="refreshAll()">↻ 刷新</button>
      </div>
    </div>

    <div class="view-tabs">
      <button id="tab-focus" class="on" onclick="switchView('focus')">今日焦点</button>
      <button id="tab-cases" onclick="switchView('cases')">案件</button>
      <button id="tab-cal" onclick="switchView('cal')">月历</button>
    </div>

    <!-- 今日焦点（默认页） -->
    <div class="view-panel on" id="panel-focus">
      <div class="focus-sec">
        <div class="focus-title">🔴 紧急期限 <span class="cnt" id="focus-red-cnt">0</span></div>
        <div class="deadline-bar" id="deadline-bar" style="margin-bottom:0"></div>
      </div>
      <div class="focus-sec">
        <div class="focus-title">⚖ 近期开庭（60 天内） <span class="cnt" id="focus-hearing-cnt">0</span></div>
        <div id="focus-hearings"></div>
      </div>
      <div class="focus-sec">
        <div class="focus-title">📌 停滞案件（有积压且无进行中任务） <span class="cnt" id="focus-stale-cnt">0</span></div>
        <div class="stale-chips" id="focus-stale"></div>
      </div>
    </div>

    <!-- 案件列表 -->
    <div class="view-panel" id="panel-cases">
      <div class="cases-toolbar" id="cases-toolbar">
        <input class="toolbar-search" id="case-search" placeholder="搜索 案件名 / 案号 / 案由…" oninput="renderCases()">
      </div>
      <div class="case-grid" id="case-grid">
        <div class="loading">加载案件中…</div>
      </div>
      <div class="closed-group" id="closed-group" style="display:none">
        <div class="closed-head" onclick="toggleClosed()">
          <span id="closed-arrow">▸</span> 已结案案件 <span id="closed-cnt"></span>
        </div>
        <div class="closed-cards" id="closed-cards" style="display:none"></div>
      </div>
    </div>

    <!-- 月历 -->
    <div class="view-panel" id="panel-cal">
      <div class="cal-wrap">
        <div class="cal-head">
          <h3 id="cal-title">—</h3>
          <div class="cal-nav">
            <button onclick="calShift(-1)">‹ 上月</button>
            <button onclick="calGoToday()">今天</button>
            <button onclick="calShift(1)">下月 ›</button>
          </div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legend">
          <span><i style="background:rgba(74,124,159,.4)"></i>开庭/听证</span>
          <span><i style="background:var(--warn-red)"></i>逾期/≤7天</span>
          <span><i style="background:var(--warn-yellow)"></i>≤30天</span>
          <span><i style="background:var(--ok-green)"></i>&gt;30天</span>
          <span>已抵消期限不显示</span>
        </div>
      </div>
    </div>

    <!-- 案件详情（完整页，非页签；由案件卡/焦点/月历进入） -->
    <div class="view-panel" id="panel-detail"></div>
  </main>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script>
    const API = '';
    let CASES = [];
    const expandedCase = new Set();

    async function api(path, opts) {
      const r = await fetch(API + path, opts);
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        throw new Error(err.message || ('HTTP ' + r.status));
      }
      return r.json();
    }

    function toast(msg, type = '') {
      const wrap = document.getElementById('toast-wrap');
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3200);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadOverview() {
      try {
        const d = await api('/api/v1/overview');
        document.getElementById('stat-todo').textContent = d.totals.todo;
        document.getElementById('stat-progress').textContent = d.totals.in_progress;
        document.getElementById('stat-done').textContent = d.totals.done;
        renderTaskFlow([...d.kanban.in_progress, ...d.kanban.todo, ...d.kanban.done]);
        document.getElementById('updated-time').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
      } catch (e) {
        toast('加载概览失败: ' + e.message, 'error');
      }
    }

    async function openFile(caseId, file) {
      try {
        const r = await api('/api/v1/open', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({case_id: caseId, file})
        });
        if (!r.ok) toast('打开失败: ' + (r.message || ''), 'warn');
      } catch (e) { toast('打开失败: ' + e.message, 'error'); }
    }

    const fileBtn = (t) => t.file
      ? `<span class="tf-file" title="${escapeHtml(t.file)}" onclick="event.stopPropagation();openFile('${t.case_id}', ${JSON.stringify(t.file).replace(/"/g, '&quot;')})">📄</span>` : '';

    let TF_SHOW_DONE = false;
    function renderTaskFlow(tasks) {
      const box = document.getElementById('task-flow');
      const prog = tasks.filter(t => t.status === 'in_progress');
      const todo = tasks.filter(t => t.status === 'todo')
        .sort((a, b) => String(a.deadline || '9999').localeCompare(String(b.deadline || '9999')));
      const done = tasks.filter(t => t.status === 'done');
      const item = (t, doneStyle) => {
        let chip = '';
        if (t.deadline) {
          const dl = Math.floor((new Date(t.deadline) - new Date()) / 86400000);
          chip = `<span class="tf-chip ${dl < 0 ? 'red' : dl <= 7 ? 'soon' : ''}">${dl < 0 ? '逾期' + (-dl) + '天' : dl + '天'}</span>`;
        } else if (t.priority === 'high') {
          chip = '<span class="tf-chip red">高</span>';
        }
        return `<div class="tf-item ${t.status} ${t.writable ? '' : 'readonly'}"
          ${t.writable ? `onclick="toggleTask(${JSON.stringify(t).replace(/"/g, '&quot;')})"` : `onclick="toast('此任务不支持切换', 'warn')"`}
          title="${escapeHtml(t.case_short)} · ${escapeHtml(t.title)}">
          <span class="tf-dot ${t.status}"></span>
          <div class="tf-body"><div class="tf-title">${escapeHtml(t.title)}</div>
            <div class="tf-case">${escapeHtml(t.case_short)}</div></div>
          ${chip}${fileBtn(t)}
        </div>`;
      };
      let html = '';
      if (prog.length) html += `<div class="tf-sec">进行中<span>${prog.length}</span></div>` + prog.map(t => item(t)).join('');
      html += `<div class="tf-sec">待办<span>${todo.length}</span></div>`
        + (todo.length ? todo.map(t => item(t)).join('') : '<div class="empty-hint" style="padding:10px">暂无待办</div>');
      html += `<div class="tf-done-head" onclick="TF_SHOW_DONE=!TF_SHOW_DONE;refreshAll()">${TF_SHOW_DONE ? '收起' : '展开'}已完成（${done.length}）</div>`;
      if (TF_SHOW_DONE && done.length) html += done.map(t => item(t, true)).join('');
      box.innerHTML = html;
    }

    function renderDeadlines(deadlines) {
      const bar = document.getElementById('deadline-bar');
      if (!deadlines || deadlines.length === 0) {
        bar.innerHTML = '<div class="empty-hint" style="padding:8px 0">无近期期限预警</div>';
        return;
      }
      bar.innerHTML = deadlines.map(d => {
        const dl = d.days_left;
        let txt;
        if (dl < 0) txt = `逾期 ${-dl} 天`;
        else if (dl === 0) txt = '今天到期';
        else if (dl === 1) txt = '明天到期';
        else txt = `剩 ${dl} 天`;
        return `<div class="deadline-item ${d.level}" onclick="openCase('${d.case_id}')" title="${escapeHtml(d.case_short)}">
          <div class="dl-name">${escapeHtml(d.name)} · ${escapeHtml(d.case_short)}</div>
          <div class="dl-meta"><span>${escapeHtml(d.end_date)}</span><span class="dl-days">${txt}</span></div>
        </div>`;
      }).join('');
    }

    /* ---------- 月历 ---------- */
    let CAL = { days: {}, today: '' };
    let calY = 0, calM = 0;

    async function loadCalendar() {
      try {
        CAL = await api('/api/v1/calendar');
        if (!calY) { const t = new Date(CAL.today || Date.now()); calY = t.getFullYear(); calM = t.getMonth() + 1; }
        renderCal();
      } catch (e) { toast('加载月历失败: ' + e.message, 'error'); }
    }

    function calShift(n) { calM += n; if (calM > 12) { calM = 1; calY++; } if (calM < 1) { calM = 12; calY--; } renderCal(); }
    function calGoToday() { const t = new Date(CAL.today || Date.now()); calY = t.getFullYear(); calM = t.getMonth() + 1; renderCal(); }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function renderCal() {
      document.getElementById('cal-title').textContent = `${calY} 年 ${calM} 月`;
      const first = new Date(calY, calM - 1, 1);
      const startDow = (first.getDay() + 6) % 7;               /* 周一开头 */
      const dim = new Date(calY, calM, 0).getDate();
      const prevDim = new Date(calY, calM - 1, 0).getDate();
      const todayStr = CAL.today || '';
      const grid = [];
      ['一','二','三','四','五','六','日'].forEach(d => grid.push(`<div class="cal-dow">${d}</div>`));
      for (let i = 0; i < startDow; i++) {
        const d = prevDim - startDow + 1 + i;
        grid.push(`<div class="cal-cell other"><div class="cal-num">${d}</div></div>`);
      }
      for (let d = 1; d <= dim; d++) {
        const key = `${calY}-${pad2(calM)}-${pad2(d)}`;
        const evs = CAL.days[key] || [];
        const evHtml = evs.slice(0, 3).map(ev => {
          const fb = ev.file ? ` <span title="${escapeHtml(ev.file)}" onclick="event.stopPropagation();openFile('${ev.case_id}', ${JSON.stringify(ev.file).replace(/"/g, '&quot;')})" style="cursor:pointer">📄</span>` : '';
          if (ev.kind === 'hearing') {
            return `<span class="cal-ev hearing" title="${escapeHtml(ev.case_short)}：${escapeHtml(ev.name)}" onclick="showCase('${ev.case_id}')">⚖ ${escapeHtml(ev.name)}${fb}</span>`;
          }
          const dl = ev.days_left;
          const txt = dl < 0 ? `逾期${-dl}天` : dl === 0 ? '今天' : `${dl}天`;
          const cls = dl < 0 || dl <= 7 ? 'red' : dl <= 30 ? 'yellow' : 'green';
          return `<span class="cal-ev deadline ${cls}" title="${escapeHtml(ev.case_short)}：${escapeHtml(ev.name)} 截止" onclick="showCase('${ev.case_id}')">⏰ ${escapeHtml(ev.name)} · ${txt}${fb}</span>`;
        }).join('');
        const more = evs.length > 3 ? `<div class="cal-more">+${evs.length - 3} 更多…</div>` : '';
        grid.push(`<div class="cal-cell ${key === todayStr ? 'today' : ''}"><div class="cal-num">${d}</div>${evHtml}${more}</div>`);
      }
      const tail = (7 - (startDow + dim) % 7) % 7;
      for (let i = 1; i <= tail; i++) grid.push(`<div class="cal-cell other"><div class="cal-num">${i}</div></div>`);
      document.getElementById('cal-grid').innerHTML = grid.join('');
    }

    function switchView(v) {
      document.querySelectorAll('.view-tabs button').forEach(b => b.classList.remove('on'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('on'));
      const tabMap = {focus: 'focus', cases: 'cases', cal: 'cal'};
      if (v === 'detail') {
        document.getElementById('tab-cases').classList.add('on');   /* 详情归属案件页签高亮 */
      } else {
        document.getElementById('tab-' + tabMap[v]).classList.add('on');
      }
      document.getElementById('panel-' + v).classList.add('on');
      if (v === 'cal') loadCalendar();
    }

    let LAST_VIEW = 'focus';
    function showCase(id) { LAST_VIEW = document.querySelector('.view-panel.on')?.id?.replace('panel-', '') || 'cases'; renderDetail(id); switchView('detail'); }
    function backToList() { switchView(LAST_VIEW === 'detail' ? 'cases' : LAST_VIEW); }

    /* ---------- 今日焦点 ---------- */
    let FOCUS = null;
    async function loadFocus() {
      try {
        FOCUS = await api('/api/v1/focus');
        renderFocus();
      } catch (e) { toast('加载焦点失败: ' + e.message, 'error'); }
    }
    function renderFocus() {
      const red = FOCUS.red_deadlines || [];
      document.getElementById('focus-red-cnt').textContent = red.length + ' 项';
      renderDeadlines(red.length ? red : (FOCUS.all || []));
      if (!red.length) document.getElementById('deadline-bar').innerHTML = '<div class="empty-hint" style="padding:8px 0">✅ 无紧急期限</div>';
      const hs = FOCUS.hearings_upcoming || [];
      document.getElementById('focus-hearing-cnt').textContent = hs.length + ' 场';
      document.getElementById('focus-hearings').innerHTML = hs.length ? hs.map(h => `
        <div class="hearing-row" onclick="showCase('${h.case_id}')">
          <div class="hearing-date"><b>${escapeHtml(h.date)}</b><span>${h.days_left === 0 ? '今天' : h.days_left + ' 天后'}</span></div>
          <div class="hearing-body">${escapeHtml(h.subject)}${h.place ? ' · ' + escapeHtml(h.place) : ''}
            <div class="h-case">${escapeHtml(h.case_short)} · ${escapeHtml(h.type)}</div></div>
        </div>`).join('') : '<div class="empty-hint">60 天内无开庭安排</div>';
      const st = FOCUS.stale_cases || [];
      document.getElementById('focus-stale-cnt').textContent = st.length + ' 件';
      document.getElementById('focus-stale').innerHTML = st.length ? st.map(s => `
        <span class="stale-chip" onclick="showCase('${s.case_id}')">${escapeHtml(s.case_short)}
          <b>${s.todo} 项积压</b>${s.data_stale ? ' · 数据待同步' : ''} · ${escapeHtml(s.stage || '')}</span>`).join('')
        : '<div class="empty-hint">无停滞案件</div>';
    }

    let FILTER_STAGE = '全部';
    let CLOSED_OPEN = false;
    let DETAIL_ID = null;

    async function loadCases() {
      try {
        CASES = await api('/api/v1/cases');
        buildStageChips();
        renderCases();
      } catch (e) {
        document.getElementById('case-grid').innerHTML = '<div class="loading">加载失败: ' + escapeHtml(e.message) + '</div>';
      }
    }

    function buildStageChips() {
      const stages = [...new Set(CASES.filter(c => c.lifecycle !== '已结案').map(c => c.stage).filter(Boolean))];
      const bar = document.getElementById('cases-toolbar');
      bar.querySelectorAll('.chip').forEach(x => x.remove());
      ['全部', ...stages].forEach(s => {
        const b = document.createElement('button');
        b.className = 'chip' + (s === FILTER_STAGE ? ' on' : '');
        b.textContent = s;
        b.onclick = () => { FILTER_STAGE = s; buildStageChips(); renderCases(); };
        bar.insertBefore(b, document.getElementById('case-search'));
      });
    }

    function caseCardHtml(c, closed) {
      const tc = c.task_counts;
      const total = tc.todo + tc.in_progress + tc.done;
      const pct = total ? Math.round(tc.done / total * 100) : 0;
      const nd = c.nearest_deadline;
      const nh = c.next_hearing;
      const badges = [];
      if (nh) badges.push(`<span class="cbadge hearing">⚖ 开庭 ${escapeHtml(nh.date)}（${nh.days_left}天后）</span>`);
      if (nd && nd.level === 'red') badges.push(`<span class="cbadge red">⏰ ${escapeHtml(nd.name)} ${nd.days_left < 0 ? '逾期' + (-nd.days_left) + '天' : nd.days_left + '天内'}</span>`);
      else if (nd) badges.push(`<span class="cbadge">⏰ ${escapeHtml(nd.name)} ${nd.days_left < 0 ? '逾期' + (-nd.days_left) + '天' : '剩' + nd.days_left + '天'}</span>`);
      if (!closed && c.stale) badges.push('<span class="cbadge stale">📌 停滞</span>');
      const ndTxt = nd ? '' : '';
      return `
        <div class="case-card ${closed ? 'closed' : ''}" onclick="showCase('${c.id}')">
          <div class="case-card-head">
            <div class="case-card-title">${escapeHtml(c.display_name)}</div>
            <span class="status-badge">${escapeHtml(c.stage || c.lifecycle || '—')}</span>
          </div>
          <div class="case-cause">${escapeHtml(c.cause || '案由待补充')}${c.case_number ? ' · ' + escapeHtml(c.case_number) : ''}</div>
          <div class="case-badges">${badges.join('')}</div>
          <div class="case-meta">
            <div class="case-progress">
              <span>${tc.done}/${total}</span>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
            <span>${escapeHtml(c.lifecycle || '')}</span>
          </div>
        </div>`;
    }

    function renderCases() {
      const q = (document.getElementById('case-search').value || '').trim().toLowerCase();
      const match = c => (FILTER_STAGE === '全部' || c.stage === FILTER_STAGE)
        && (!q || (c.display_name + c.case_number + c.cause).toLowerCase().includes(q));
      const active = CASES.filter(c => c.lifecycle !== '已结案' && match(c))
        .sort((a, b) => {
          const da = a.nearest_deadline?.days_left ?? 99999, db = b.nearest_deadline?.days_left ?? 99999;
          return da - db;
        });
      const closed = CASES.filter(c => c.lifecycle === '已结案');
      document.getElementById('case-grid').innerHTML = active.length
        ? active.map(c => caseCardHtml(c, false)).join('')
        : '<div class="empty-hint">无匹配案件</div>';
      const cg = document.getElementById('closed-group');
      cg.style.display = closed.length ? '' : 'none';
      document.getElementById('closed-cnt').textContent = `（${closed.length}）`;
      const cc = document.getElementById('closed-cards');
      cc.style.display = CLOSED_OPEN ? '' : 'none';
      document.getElementById('closed-arrow').textContent = CLOSED_OPEN ? '▾' : '▸';
      cc.innerHTML = CLOSED_OPEN ? closed.map(c => caseCardHtml(c, true)).join('') : '';
    }

    function toggleClosed() { CLOSED_OPEN = !CLOSED_OPEN; renderCases(); }

    /* ---------- 案件详情页（五页签） ---------- */
    async function renderDetail(id) {
      DETAIL_ID = id;
      const el = document.getElementById('panel-detail');
      el.innerHTML = '<div class="loading">加载案件详情…</div>';
      let c;
      try { c = await api('/api/v1/case/' + id); } catch (e) {
        el.innerHTML = '<div class="loading">详情加载失败: ' + escapeHtml(e.message) + '</div>'; return;
      }
      const tasks = c.tasks || [], dls = c.deadlines || [], hs = c.hearings || [], tl = c.timeline || [];
      const cnt = {todo: 0, in_progress: 0, done: 0};
      tasks.forEach(t => cnt[t.status] = (cnt[t.status] || 0) + 1);

      const ovHtml = `
        <div class="d-card"><h4>基本信息</h4><div class="d-grid">
          ${[['案号', c.case_number], ['生命周期', c.lifecycle], ['程序阶段', c.stage], ['案由', c.cause],
             ['管辖法院', c.court], ['标的额', c.amount != null ? Number(c.amount).toLocaleString() + ' 元' : null],
             ['任务', `${cnt.done}/${tasks.length} 完成`], ['开庭与听证', hs.length + ' 场']]
            .map(([k, v]) => `<div><b>${k}</b>${escapeHtml(v || '—')}</div>`).join('')}
        </div></div>
        ${(c.instants || []).length ? `<div class="d-card"><h4>审级记录</h4><table class="d-table">
          <tr><th>审级</th><th>案号</th><th>承办法官</th><th>立案</th><th>结案</th></tr>
          ${c.instants.map(r => `<tr><td>${escapeHtml(r.审级)}</td><td>${escapeHtml(r.法院案号)}</td><td>${escapeHtml(r.承办法官)}</td>
            <td>${escapeHtml(r.立案日期)}</td><td>${escapeHtml(r.结案日期)}（${escapeHtml(r.结案方式)}）</td></tr>`).join('')}
        </table></div>` : ''}
        ${(() => {
          const wl = c.worklog || [];
          if (!wl.length && !c.worklog_total) return '';
          const rows = [...wl].sort((a, b) => String(b.日期).localeCompare(String(a.日期))).slice(0, 8)
            .map(r => `<tr><td>${escapeHtml(r.日期)}</td><td><b>${escapeHtml(String(r.时长))}h</b></td>
              <td>${escapeHtml(r.内容)}${r.关联文件 ? ` <span class="tf-file" style="display:inline-flex;vertical-align:-6px" title="${escapeHtml(r.关联文件)}" onclick="event.stopPropagation();openFile('${id}', ${JSON.stringify(r.关联文件).replace(/"/g, '&quot;')})">📄</span>` : ''}</td>
              <td>${escapeHtml([r.律师, r.关联任务].filter(Boolean).join('·') || '—')}</td></tr>`).join('');
          return `<div class="d-card"><h4>工时（累计 ${escapeHtml(String(c.worklog_total || 0))}h · ${wl.length} 条）</h4>
            ${rows ? `<table class="d-table"><tr><th>日期</th><th>时长</th><th>工作内容</th><th>关联</th></tr>${rows}</table>` : '<div class="empty-hint">暂无明细</div>'}</div>`;
        })()}
        ${(() => {
          const f = c.fees || {};
          const pay = Object.entries(f.支出 || {}).filter(([k, v]) => v && (v.金额 != null || v.状态 === '已确定'));
          const claims = f.索赔与评估 || [];
          if (!pay.length && !claims.length) return '';
          const fmt = v => v == null ? '—' : Number(v).toLocaleString() + ' 元';
          return `<div class="d-card"><h4>费用</h4><table class="d-table">
            <tr><th>类别</th><th>金额</th><th>状态/口径</th></tr>
            ${pay.map(([k, v]) => `<tr><td>${escapeHtml(k)}${v.计费方式 ? '（' + escapeHtml(v.计费方式) + '）' : ''}</td><td>${fmt(v.金额)}</td><td>${escapeHtml(v.状态 || '待确定')}</td></tr>`).join('')}
            ${claims.map(x => `<tr><td>索赔：${escapeHtml(x.项目)}</td><td>${fmt(x.金额)}</td><td>${escapeHtml(x.计算方式 || '—')}</td></tr>`).join('')}
          </table></div>`;
        })()}`;

      const tcard = (t, col) => {
        const mark = {todo: '☐', in_progress: '◐', done: '☑'}[t.status];
        return `<div class="d-tcard ${t.status}" ${t.writable
          ? `onclick="toggleTask(${JSON.stringify(t).replace(/"/g, '&quot;')})"` : ''}
          title="${t.writable ? '点击切换状态' : '只读'}">
          <div class="tt">${mark} ${escapeHtml(t.title)}${t.file ? ` <span class="tf-file" style="display:inline-flex;vertical-align:-6px" title="${escapeHtml(t.file)}" onclick="event.stopPropagation();openFile('${id}', ${JSON.stringify(t.file).replace(/"/g, '&quot;')})">📄</span>` : ''}</div>
          <div class="tm">${escapeHtml(t.priority || '')}${t.deadline ? ' · 截止 ' + escapeHtml(t.deadline) : ''}${t.owner ? ' · ' + escapeHtml(t.owner) : ''}</div>
        </div>`;
      };
      const taskHtml = tasks.length ? `
        <div class="d-kan">
          <div class="d-kcol"><h5>待办 <span>${cnt.todo}</span></h5>${tasks.filter(t => t.status === 'todo').map(t => tcard(t)).join('')}</div>
          <div class="d-kcol"><h5>进行中 <span>${cnt.in_progress}</span></h5>${tasks.filter(t => t.status === 'in_progress').map(t => tcard(t)).join('') || '<div class="empty-hint">暂无</div>'}</div>
          <div class="d-kcol"><h5>已完成 <span>${cnt.done}</span></h5>${tasks.filter(t => t.status === 'done').map(t => tcard(t)).join('') || '<div class="empty-hint">暂无</div>'}</div>
        </div>` : '<div class="empty-hint">无任务</div>';

      const dlHtml = dls.length ? `<div class="d-dlwrap">${dls.map(d => {
        const lv = d.level || 'none';
        const dl2 = d.days_left;
        const num = d.status === 'done' ? '✓' : dl2 == null ? '—' : dl2;
        const unit = d.status === 'done' ? '已完成' : dl2 == null ? '' : '天' + (dl2 < 0 ? '（逾期）' : '');
        return `<div class="d-dlcard ${lv}"><div class="d-dlnum"><b>${escapeHtml(String(num))}</b><span>${unit}</span></div>
          <div><div style="font-weight:600">${escapeHtml(d.name)}</div>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:3px">截止 ${escapeHtml(d.end_date)}${d.status === 'done' ? ' · 已完成' : ''}</div></div></div>`;
      }).join('')}</div>` : '<div class="empty-hint">无期限记录</div>';
      const hearingTable = hs.length ? `<div class="d-card" style="margin-top:12px"><h4>开庭与听证</h4><table class="d-table">
        <tr><th>日期</th><th>类型</th><th>事项</th><th>地点</th><th>状态</th><th>文书</th></tr>
        ${hs.map(h => `<tr><td><b>${escapeHtml(h.date)}</b></td><td>${escapeHtml(h.type)}</td><td>${escapeHtml(h.subject)}</td>
          <td>${escapeHtml(h.place || '—')}</td><td>${h.status === 'done' ? '已进行' : '<b style="color:var(--accent-secondary)">已排期</b>'}</td>
          <td>${h.file ? `<span class="tf-file" title="${escapeHtml(h.file)}" onclick="openFile('${id}', ${JSON.stringify(h.file).replace(/"/g, '&quot;')})">📄</span>` : '—'}</td></tr>`).join('')}
      </table></div>` : '';

      const tlSorted = [...tl].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const tlHtml = tlSorted.length ? `<div class="d-tl">${tlSorted.map(e2 => `
        <div class="d-tl-i"><div class="d-tl-d">${escapeHtml(e2.date)}${e2.file ? ` <span class="tf-file" style="display:inline-flex;vertical-align:-6px" title="${escapeHtml(e2.file)}" onclick="event.stopPropagation();openFile('${id}', ${JSON.stringify(e2.file).replace(/"/g, '&quot;')})">📄</span>` : ''}</div><div class="d-tl-t">${escapeHtml(e2.event)}</div></div>`).join('')}</div>`
        : '<div class="empty-hint">无时间线</div>';

      const partyHtml = (c.parties || []).length ? `<div class="d-card"><h4>当事人</h4><ul class="d-people">
        ${c.parties.map(p => `<li><span class="d-tag">${escapeHtml(p.side)}</span><b>${escapeHtml(p.name)}</b>（${escapeHtml(p.role)}${p.type ? ' · ' + escapeHtml(p.type) : ''}）${p.note ? '——' + escapeHtml(p.note) : ''}</li>`).join('')}
      </ul></div>` : '';
      const evHtml = (c.evidence || []).length ? `<div class="d-card"><h4>证据索引</h4><table class="d-table">
        <tr><th>名称</th><th>类型</th><th>证明目的</th><th>状态</th></tr>
        ${c.evidence.map(e2 => `<tr><td>${escapeHtml(e2.名称)}</td><td>${escapeHtml(e2.类型)}</td><td>${escapeHtml(e2.证明目的 || '—')}</td>
          <td>${e2.状态 === 'done' ? '已收集' : '待收集'}</td></tr>`).join('')}
      </table></div>` : '';

      el.innerHTML = `
        <button class="d-back" onclick="backToList()">‹ 返回</button>
        <div class="d-head">
          <h2>${escapeHtml(c.display_name)}</h2>
          <div class="d-sub">
            <span>生命周期：<b>${escapeHtml(c.lifecycle || '—')}</b></span>
            <span>阶段：<b>${escapeHtml(c.stage || '—')}</b></span>
            <span>${escapeHtml(c.case_number || '案号待立案')}</span>
            <button class="refresh-btn" onclick="openFolder('${id}')">📁 打开文件夹</button>
          </div>
        </div>
        <div class="d-tabs" id="d-tabs">
          <button data-d="ov" class="on">概览</button>
          <button data-d="task">任务 (${tasks.length})</button>
          <button data-d="dl">期限与开庭 (${dls.length + hs.length})</button>
          <button data-d="tl">时间线 (${tl.length})</button>
          <button data-d="pe">当事人与证据 (${(c.parties || []).length + (c.evidence || []).length})</button>
        </div>
        <div class="d-sec on" id="d-sec-ov">${ovHtml}</div>
        <div class="d-sec" id="d-sec-task">${taskHtml}</div>
        <div class="d-sec" id="d-sec-dl">${dlHtml}${hearingTable}</div>
        <div class="d-sec" id="d-sec-tl">${tlHtml}</div>
        <div class="d-sec" id="d-sec-pe">${partyHtml}${evHtml || '<div class="empty-hint">无证据索引</div>'}</div>`;
      document.querySelectorAll('#d-tabs button').forEach(b => {
        b.onclick = () => {
          document.querySelectorAll('#d-tabs button').forEach(x => x.classList.remove('on'));
          document.querySelectorAll('.d-sec').forEach(s => s.classList.remove('on'));
          b.classList.add('on');
          document.getElementById('d-sec-' + b.dataset.d).classList.add('on');
        };
      });
    }

    async function openFolder(id) {
      try {
        await api('/api/v1/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({case_id: id})});
      } catch (e) {
        toast('打开失败: ' + e.message, 'error');
      }
    }
    /* 兼容旧调用点：点期限/月历事件 → 进详情页 */
    function openCase(id) { showCase(id); }

    async function toggleTask(task) {
      const newStatus = task.status === 'done' ? 'todo' : 'done';
      try {
        const r = await api('/api/v1/task/toggle', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({case_id: task.case_id, source_ref: task.source_ref, target_status: newStatus})
        });
        if (r.ok) {
          toast(`已标记为「${newStatus === 'done' ? '已完成' : '待办'}」`, 'ok');
          refreshAll();
        } else {
          toast('切换失败: ' + r.message, 'warn');
        }
      } catch (e) {
        toast('切换失败: ' + e.message, 'error');
      }
    }

    async function openCase(id) {
      try {
        await api('/api/v1/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({case_id: id})});
      } catch (e) {
        toast('打开失败: ' + e.message, 'error');
      }
    }

    async function refreshAll() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      await Promise.all([loadOverview(), loadCases(), loadFocus()]);
      if (DETAIL_ID && document.getElementById('panel-detail').classList.contains('on')) {
        renderDetail(DETAIL_ID);
      }
      btn.disabled = false;
    }

    // 初始化
    refreshAll();
    setInterval(loadOverview, 60000);  // 侧边栏每分钟刷新
  </script>

</body>
</html>
