<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>标题+要点列表页模板</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    :root {
      --ink: #18181B; --ink-rgb: 24,24,27;
      --paper: #FAFAF8; --paper-rgb: 250,250,248;
      --accent: #D97706; --accent-light: #F59E0B;
      --muted: #52525B; --surface: #FFFFFF; --surface-rgb: 255,255,255;
    }
    .bullet-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bullet-list li {
      font-size: var(--text-lg);
      line-height: 1.65;
      color: var(--ink);
      padding-left: 20px;
      position: relative;
    }
    .bullet-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <!--
    标题+要点列表页 (Content List)
    视觉层级：kicker → page-title → bullet points
    适用：核心观点罗列、要点总结、规则说明
  -->
  <div class="slide light">
    <div class="chrome">
      <p>章节标签 · Section</p>
      <p>03 / 12</p>
    </div>

    <div class="v-center" style="padding-top: 8px;">
      <p class="kicker" data-anim>KEY POINTS</p>
      <h2 class="section-title" data-anim>页面标题</h2>
      <ul class="bullet-list" data-anim>
        <li>要点一：每条控制在两行以内，动词开头</li>
        <li>要点二：先给结论，再展开关键论据</li>
        <li>要点三：保持逻辑递进，从事实到判断</li>
        <li>要点四：末条可放行动建议或开放性问题</li>
      </ul>
    </div>

    <div class="foot">
      <p>页面说明 · Description</p>
      <p>— · —</p>
    </div>
  </div>
</body>
</html>
