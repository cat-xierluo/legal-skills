<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>封面页模板</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    /* 主题：法律黑金 — 在这里切换主题变量即可 */
    :root {
      --ink: #18181B; --ink-rgb: 24,24,27;
      --paper: #FAFAF8; --paper-rgb: 250,250,248;
      --accent: #D97706; --accent-light: #F59E0B;
      --muted: #52525B; --surface: #FFFFFF; --surface-rgb: 255,255,255;
    }
  </style>
</head>
<body>
  <!--
    封面页 (Cover)
    视觉层级：kicker → hero-title → subtitle → meta-row
    适用：演示开场、章节封面、收束页
  -->
  <div class="slide dark">
    <div class="chrome">
      <p>标签 · Context</p>
      <p>2026.06</p>
    </div>

    <div class="v-center" style="padding: 0 8%;">
      <p class="kicker" data-anim>LEGAL SEMINAR</p>
      <h1 class="hero-title" data-anim>演示文稿标题</h1>
      <p class="lead" style="color: rgba(250,250,248,0.65); margin-top: 16px;" data-anim>
        副标题或一句话概括，不超过两行。保持克制，让主标题呼吸。
      </p>
      <div class="deco-line short" data-anim></div>
      <div class="meta-row" style="margin-top: 8px;" data-anim>
        <span>演讲者姓名</span><span>·</span><span>职位/机构</span><span>·</span><span>2026.06.02</span>
      </div>
    </div>

    <div class="foot">
      <p>活动名称 · Venue</p>
      <p>— · —</p>
    </div>
  </div>
</body>
</html>
