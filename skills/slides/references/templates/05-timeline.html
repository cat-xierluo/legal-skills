<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>横向时间线页模板</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    :root {
      --ink: #18181B; --ink-rgb: 24,24,27;
      --paper: #FAFAF8; --paper-rgb: 250,250,248;
      --accent: #D97706; --accent-light: #F59E0B;
      --muted: #52525B; --surface: #FFFFFF; --surface-rgb: 255,255,255;
    }
    .timeline-rail {
      position: absolute;
      left: 80px;
      right: 80px;
      top: 265px;
      height: 2px;
      background: rgba(var(--ink-rgb), 0.1);
    }
    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      margin-top: 8px;
    }
    .timeline-grid .timeline-node {
      padding-top: 24px;
    }
    .timeline-grid .timeline-dot {
      top: -6px;
    }
  </style>
</head>
<body>
  <!--
    横向时间线页 (Timeline)
    视觉层级：kicker → page-title → 时间轴 + 节点
    每个节点：timeline-date → h3 → 说明文字
    适用：案件经过、项目里程碑、法规演进
    节点数：3-5 个，每个只写"时间 + 事件 + 意义"
  -->
  <div class="slide light">
    <div class="chrome">
      <p>时间线 · Timeline</p>
      <p>06 / 12</p>
    </div>

    <div style="padding-top: 10px; position: relative;">
      <p class="kicker" data-anim>KEY EVENTS</p>
      <h2 class="page-title" data-anim>关键时间线</h2>

      <div class="timeline-rail" data-anim></div>

      <div class="timeline-grid" style="margin-top: 56px;">
        <div class="timeline-node" data-anim>
          <div class="timeline-dot"></div>
          <p class="timeline-date">2026.01</p>
          <h3 class="card-title">事件一</h3>
          <p class="body-text">简要说明意义，一行即可。</p>
        </div>
        <div class="timeline-node" data-anim>
          <div class="timeline-dot"></div>
          <p class="timeline-date">2026.03</p>
          <h3 class="card-title">事件二</h3>
          <p class="body-text">聚焦转折点，不说废话。</p>
        </div>
        <div class="timeline-node" data-anim>
          <div class="timeline-dot"></div>
          <p class="timeline-date">2026.05</p>
          <h3 class="card-title">事件三</h3>
          <p class="body-text">强调因果关系。</p>
        </div>
        <div class="timeline-node" data-anim>
          <div class="timeline-dot"></div>
          <p class="timeline-date">2026.06</p>
          <h3 class="card-title">事件四</h3>
          <p class="body-text">当前状态或结论。</p>
        </div>
      </div>
    </div>

    <div class="foot">
      <p>事件脉络 · Event Chain</p>
      <p>— · —</p>
    </div>
  </div>
</body>
</html>
