<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>案例/证据卡片页模板</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    :root {
      --ink: #18181B; --ink-rgb: 24,24,27;
      --paper: #FAFAF8; --paper-rgb: 250,250,248;
      --accent: #D97706; --accent-light: #F59E0B;
      --muted: #52525B; --surface: #FFFFFF; --surface-rgb: 255,255,255;
    }
    .evidence-main {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 22px;
      border-left: 3px solid var(--accent);
    }
    .evidence-risk {
      background: var(--ink);
      border-radius: var(--radius-md);
      padding: 22px;
      color: var(--paper);
    }
    .evidence-risk ul {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .evidence-risk ul li {
      font-size: var(--text-sm);
      line-height: 1.7;
      padding-left: 16px;
      position: relative;
      color: rgba(var(--paper-rgb), 0.82);
    }
    .evidence-risk ul li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <!--
    案例/证据卡片页 (Case Evidence)
    视觉层级：kicker → page-title → 两栏（主要内容 + 风险/补充）
    左栏：证明目的 + 标题 + 说明 + 来源标注
    右栏：风险提示 / 补充说明
    适用：判例拆解、证据链说明、合同条款风险页
  -->
  <div class="slide light">
    <div class="chrome">
      <p>证据分析 · Evidence</p>
      <p>09 / 12</p>
    </div>

    <div style="padding-top: 8px;">
      <p class="kicker" data-anim>EVIDENCE E-03</p>
      <h2 class="page-title" data-anim>证据标题</h2>

      <div class="grid-7-5" style="gap: 28px; margin-top: 4px;">
        <div class="evidence-main" data-anim>
          <p class="step-number" style="margin-bottom: 10px;">证明目的</p>
          <h3 class="card-title">证明结论的标题</h3>
          <p class="body-text" style="margin-top: 12px;">
            详细说明这个证据的内容、来源和证明逻辑。保持客观叙述，不做推测。
          </p>
          <p style="font-size: var(--text-xs); color: var(--muted); margin-top: 16px;">
            来源：标注出处，可回溯
          </p>
        </div>
        <div class="evidence-risk" data-anim>
          <p style="font-size: var(--text-xs); font-weight: 700; color: var(--accent-light); letter-spacing: 1px; margin-bottom: 12px;">RISK</p>
          <h3 class="card-title" style="color: var(--paper);">风险提示</h3>
          <ul style="margin-top: 12px;">
            <li>风险点一：简要说明</li>
            <li>风险点二：简要说明</li>
            <li>风险点三：简要说明</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="foot">
      <p>证据编号 · E-03</p>
      <p>— · —</p>
    </div>
  </div>
</body>
</html>
