<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两份资料怎样汇总？ · 页内动效示例</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f5;color:#1b2927;font:22px/1.5 system-ui,sans-serif}
.slide{width:1280px;height:720px;padding:56px 72px 84px;display:flex;flex-direction:column}
h1{font-size:52px;line-height:1.15;margin:28px 0 32px} h2{font-size:32px;margin:0 0 10px}
p{margin:0 0 14px}
.fallback{display:block}
[hidden]{display:none!important}
@media screen{
  html:not([data-slides-static-export]) body:not(.exporting) .slide.is-live .fallback{display:none}
}
:is(html[data-slides-static-export],body.exporting) :is(.motion,#hint){display:none!important}
@media print{.motion,#hint{display:none!important}}
.motion{width:100%;border-top:1px solid #a9b9b3;border-bottom:1px solid #a9b9b3}
.queue-row{display:grid;grid-template-columns:280px 1fr 125px;align-items:center;gap:22px;padding:18px 15px;border-bottom:1px solid #cad6d0;background:#fff;transition:background .25s}
.queue-row:last-child{border-bottom:0}
.queue-row>strong{font-weight:650}
.queue-row h2{font:650 22px/1.4 system-ui;margin:0}
.queue-row small{font-size:16px;color:#51665d}
.queue-row [data-state]{justify-self:start;font-size:16px;border-radius:4px;padding:3px 8px;background:#eeefe8;color:#656044;transition:background .25s}
.motion:is([data-step="1"],[data-step="2"]) .source [data-state],
.motion[data-step="2"] .result [data-state]{color:#244e40;background:#d9ebe1}
.motion[data-step="2"] .result{background:#e9f2ec}
#hint{position:fixed;bottom:22px;right:25px;color:#54635b;font:14px/1.4 system-ui,sans-serif;text-align:right;z-index:1}
#cue-hud{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:7px}
#cue-hud button{min-width:30px;height:30px;background:#fff;color:#214b3c;border:1px solid #9cb1a5;border-radius:5px;font:650 18px/1 system-ui;cursor:pointer}
#cue-hud button[aria-disabled="true"]{cursor:default;color:#656d65;background:#eceeea}
#cue-hud button:focus-visible{outline:2px solid #075945;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.motion *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section class="slide">
  <h1>两份资料怎样汇总？</h1>
  <div class="fallback">
    <h2>证据摘要</h2>
    <p>事实表和核对记录可分别整理。两份都就绪，才进入汇总。</p>
    <p>回看范围：摘要中的事实仍能追溯到原始记录。</p>
  </div>
  <div class="motion" data-step="0" aria-label="资料汇总示意" hidden>
    <div class="queue-row source"><strong>事实表</strong><small>整理待引用的事实</small><span data-state>整理中</span></div>
    <div class="queue-row source"><strong>核对记录</strong><small>保留对应的原始材料</small><span data-state>整理中</span></div>
    <div class="queue-row result">
      <h2>汇总区</h2><small data-ready hidden>证据摘要已形成，保留原件出处</small>
      <small data-wait>等两份资料都就绪</small><span data-state>等待</span>
    </div>
  </div>
</section>
<section class="slide">
  <h1>证据可回看</h1>
  <p>摘要能简化阅读，原始记录继续保留。</p>
</section>
<aside id="hint" hidden>
  <div id="cue-hud" role="group" aria-label="页内步骤" hidden>
    <span id="cue-number" aria-live="polite"></span>
    <button type="button" data-action="start" aria-label="从头开始">↺</button>
    <button type="button" data-action="prev" aria-label="上一步">‹</button>
    <button type="button" data-action="next" aria-label="下一步">›</button>
  </div>
  <span>空格 推进 · B 静态</span>
</aside>
<script src="../../assets/slide-steps.js"></script>
<script>
(() => {
  if (!window.SlidesSteps) return;
  const root = document.querySelector(".motion");
  const slide = root.closest(".slide");
  const hint = document.getElementById("hint");
  const hud = document.getElementById("cue-hud");
  const counter = document.getElementById("cue-number");
  const buttons = [...hud.querySelectorAll("button")];
  const staticExport = () => document.documentElement.hasAttribute("data-slides-static-export");
  let shown = true, playing = true;
  root.addEventListener("slides:step", ({detail:{index}}) => {
    root.querySelectorAll(".source [data-state]").forEach(node => {
      node.textContent = index>=1 ? "已就绪" : "整理中";
    });
    root.querySelector("[data-ready]").hidden = index!==2;
    root.querySelector("[data-wait]").hidden = index===2;
    root.querySelector(".result [data-state]").textContent = ["等待","可汇总","已汇总"][index];
    counter.textContent = (index+1)+"/3";
    for (const button of buttons) {
      button.setAttribute("aria-disabled", String(button.dataset.action==="next" ? index===2 : index===0));
    }
  });
  const control = window.SlidesSteps.mount(root, {stepCount:3});
  function update() {
    const live = shown && playing && !staticExport();
    slide.classList.toggle("is-live",live);
    root.hidden = !live;
    hud.hidden = !live;
    hint.hidden = !shown;
  }
  hud.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (button && !hud.hidden && !staticExport()) control.go(
      button.dataset.action==="start" ? 0 : control.index+(button.dataset.action==="prev" ? -1 : 1)
    );
  });
  window.addEventListener("keydown", event => {
    if (staticExport() || !shown) return;
    if (event.key.toLowerCase() === "b" && !event.altKey && !event.ctrlKey && !event.metaKey && !event.repeat) {
      playing = !playing;
      update();
    } else if (!root.hidden) control.handleKey(event);
  });
  new IntersectionObserver(([entry]) => { shown = entry.intersectionRatio > .5; update(); },
    {threshold:[.5]}).observe(slide);
  update();
})();
</script>
</body>
</html>
