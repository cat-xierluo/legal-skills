<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>大数据/KPI看板页模板</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    :root {
      --ink: #18181B; --ink-rgb: 24,24,27;
      --paper: #FAFAF8; --paper-rgb: 250,250,248;
      --accent: #D97706; --accent-light: #F59E0B;
      --muted: #52525B; --surface: #FFFFFF; --surface-rgb: 255,255,255;
    }
    .stat-card {
      background: rgba(var(--surface-rgb), 0.06);
      border-radius: var(--radius-md);
      padding: 20px 22px;
    }
  </style>
</head>
<body>
  <!--
    大数据/KPI看板页 (Data Grid)
    视觉层级：kicker → section-title → 3-4 个 stat-card
    每个卡片：stat-label → stat-number → stat-note
    适用：阶段成效、关键指标、工作成果汇报
  -->
  <div class="slide dark">
    <div class="chrome">
      <p>数据概览 · Overview</p>
      <p>05 / 12</p>
    </div>

    <div style="padding-top: 10px;">
      <p class="kicker" data-anim>KEY METRICS</p>
      <h2 class="section-title" style="color: var(--paper);" data-anim>关键数据标题</h2>

      <div class="grid-4" style="margin-top: 28px;">
        <div class="stat-card" data-anim>
          <p class="stat-label">LABEL ONE</p>
          <p class="stat-number">98%</p>
          <p class="stat-note">口径说明：包含什么、不含什么。</p>
        </div>
        <div class="stat-card" data-anim>
          <p class="stat-label">LABEL TWO</p>
          <p class="stat-number">2.5M</p>
          <p class="stat-note">数字保持 2-3 位，用 K/M 简写。</p>
        </div>
        <div class="stat-card" data-anim>
          <p class="stat-label">LABEL THREE</p>
          <p class="stat-number">150+</p>
          <p class="stat-note">每个数字必须有补充说明。</p>
        </div>
        <div class="stat-card" data-anim>
          <p class="stat-label">LABEL FOUR</p>
          <p class="stat-number">12</p>
          <p class="stat-note">数据支撑决策，不是堆砌。</p>
        </div>
      </div>
    </div>

    <div class="foot">
      <p>数据来源 · Source</p>
      <p>Data · Metrics</p>
    </div>
  </div>
</body>
</html>
