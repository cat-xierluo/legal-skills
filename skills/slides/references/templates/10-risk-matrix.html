<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>风险矩阵页模板</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    :root {
      --ink: #18181B; --ink-rgb: 24,24,27;
      --paper: #FAFAF8; --paper-rgb: 250,250,248;
      --accent: #D97706; --accent-light: #F59E0B;
      --muted: #52525B; --surface: #FFFFFF; --surface-rgb: 255,255,255;
    }
    .risk-high { background: #7F1D1D; border-radius: var(--radius-md); padding: 20px 22px; }
    .risk-medium { background: #92400E; border-radius: var(--radius-md); padding: 20px 22px; }
    .risk-low { background: #14532D; border-radius: var(--radius-md); padding: 20px 22px; }
    .risk-level {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 8px;
    }
    .risk-title {
      font-size: var(--text-xl);
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
    }
    .risk-desc {
      font-size: var(--text-sm);
      line-height: 1.65;
      color: rgba(255,255,255,0.82);
    }
  </style>
</head>
<body>
  <!--
    风险矩阵页 (Risk Matrix)
    视觉层级：kicker → page-title → 3 个风险等级卡片
    高/中/低 三色区分（红/橙/绿），视觉直觉
    适用：法律风险分级、整改优先级、合同条款审查
  -->
  <div class="slide light">
    <div class="chrome">
      <p>风险评估 · Risk</p>
      <p>11 / 12</p>
    </div>

    <div style="padding-top: 8px;">
      <p class="kicker" data-anim>RISK ASSESSMENT</p>
      <h2 class="page-title" data-anim>风险优先级</h2>

      <div class="grid-3" style="gap: 22px; margin-top: 8px;">
        <div class="risk-high" data-anim>
          <p class="risk-level">HIGH · 必须修改</p>
          <h3 class="risk-title">高风险项</h3>
          <p class="risk-desc">具体风险描述，说明影响和紧急程度。</p>
        </div>
        <div class="risk-medium" data-anim>
          <p class="risk-level">MEDIUM · 建议优化</p>
          <h3 class="risk-title">中风险项</h3>
          <p class="risk-desc">具体风险描述，说明建议方向。</p>
        </div>
        <div class="risk-low" data-anim>
          <p class="risk-level">LOW · 可接受</p>
          <h3 class="risk-title">低风险项</h3>
          <p class="risk-desc">具体风险描述，说明为什么可以接受。</p>
        </div>
      </div>
    </div>

    <div class="foot">
      <p>风险评级说明</p>
      <p>— · —</p>
    </div>
  </div>
</body>
</html>
