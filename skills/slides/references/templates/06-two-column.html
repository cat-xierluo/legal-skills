<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>左右对比页模板</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    :root {
      --ink: #18181B; --ink-rgb: 24,24,27;
      --paper: #FAFAF8; --paper-rgb: 250,250,248;
      --accent: #D97706; --accent-light: #F59E0B;
      --muted: #52525B; --surface: #FFFFFF; --surface-rgb: 255,255,255;
    }
    .compare-col {
      padding: 20px 22px;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .compare-col.faded {
      opacity: 0.55;
    }
    .compare-col ul {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .compare-col ul li {
      font-size: var(--text-base);
      line-height: 1.65;
      padding-left: 16px;
      position: relative;
    }
    .compare-col ul li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
  </style>
</head>
<body>
  <!--
    左右对比页 (A vs B)
    视觉层级：kicker → page-title → 两列并排
    左列 opacity 0.55（旧/弱），右列满亮度（新/强）
    适用：方案比较、新旧对比、路径选择
  -->
  <div class="slide light">
    <div class="chrome">
      <p>对比分析 · Comparison</p>
      <p>07 / 12</p>
    </div>

    <div style="padding-top: 8px;">
      <p class="kicker" data-anim>BEFORE / AFTER</p>
      <h2 class="page-title" data-anim>对比标题</h2>

      <div class="grid-2" style="gap: 32px; margin-top: 8px;">
        <div class="compare-col faded" data-anim="left">
          <p class="kicker">方案 A · 标签</p>
          <h3 class="card-title">方案标题</h3>
          <ul>
            <li>要点一</li>
            <li>要点二</li>
            <li>要点三</li>
          </ul>
        </div>
        <div class="compare-col" data-anim="right">
          <p class="kicker">方案 B · 推荐</p>
          <h3 class="card-title">方案标题</h3>
          <ul>
            <li>要点一</li>
            <li>要点二</li>
            <li>要点三</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="foot">
      <p>方案对比 · Options</p>
      <p>— · —</p>
    </div>
  </div>
</body>
</html>
