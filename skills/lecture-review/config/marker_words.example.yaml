version: 1
# 话语标记词表 —— lecture-review 口癖统计的词表
#
# 原则：
# 1. 只收 ASR 转录后仍存活的「话语标记词」。纯语气音（呃/嗯/啊）被听悟类引擎
#    大量吞掉，计数不可信，不入表（见 SKILL.md 边界一节）。
# 2. 词表是「候选证据」，不是「罪名清单」：然后/就是 作逻辑连接属正常用法，
#    是否算口癖取决于频度和位置，由 agent 结合每万字频与例句判断。
# 3. 脚本按「最长优先」去重叠计数（避免「也就是说」被重复计入「就是」「说」）。
#
# 可自行增删；改动后无需同步脚本（脚本会读取本文件，读取失败时用内置同款默认表）。

markers:
  # 指示填充 —— 高频出现即口癖强证据
  - {word: 这个, category: 指示填充}
  - {word: 那个, category: 指示填充}
  # 连接填充 —— 高频出现即口癖强证据
  - {word: 就是, category: 连接填充}
  - {word: 就是说, category: 连接填充}
  - {word: 也就是说, category: 连接填充}
  - {word: 等于说, category: 连接填充}
  # 逻辑连接 —— 正常用法占比高，仅高频报
  - {word: 然后, category: 逻辑连接}
  - {word: 其实, category: 弱化转折}
  # 解释填充 —— 中等频度即可报（律师讲课常见「相当于」癖）
  - {word: 相当于, category: 解释填充}
  - {word: 说白了, category: 解释填充}
  - {word: 换句话说, category: 解释填充}
  # 求确认 —— 双重身份：高频是口癖，但也是互动信号，两个口径都统计
  - {word: 对吧, category: 求确认}
  - {word: 对不对, category: 求确认}
  - {word: 是不是, category: 求确认}
  - {word: 知道吧, category: 求确认}
  - {word: 好不好, category: 求确认}
  - {word: 明白吧, category: 求确认}

# 段首词检测（连续多段同词开头的「起手式」口癖，如连续五段「然后」起头）
sentence_starters: [然后, 好, 那, 就是, 所以, 但是, 当然, 我们]

# 向听众喊话的词根（互动密度的原始计数，agent 再判断真伪互动）
audience_address: [大家, 各位, 你们]
