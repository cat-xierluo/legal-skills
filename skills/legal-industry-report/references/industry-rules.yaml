        - 目标市场的准入、制裁、产品责任和税务规则如何进入合同？
      indicators: [进出口额, 商品编码结构, 目的地结构, 运价或时效, 跨境电商规模, 海外仓布局]
    brief:
      watch_events: [关税与税则, 出口管制, 制裁, 海关监管, 跨境收付, 平台规则, 物流中断]
      relevance_questions: [是否影响目标市场或商品编码, 是否触发合同价格与交付条款, 是否需要制裁与交易方筛查]
    legal_risk_lenses: [国际贸易合同, 海关与税务, 出口管制与制裁, 产品责任, 跨境数据, 支付结算, 运输与保险]
    sources:
      - id: customs
        name: 海关总署统计与政务服务
        url: https://online.customs.gov.cn/
        authority: official
        use_for: [进出口统计, 税则, 原产地, 通关监管]
        cadence: monthly
        access_notes: 记录商品编码、贸易方式、币种和目的地口径
      - id: mofcom
        name: 商务部
        url: https://www.mofcom.gov.cn/
        authority: official
        use_for: [外贸政策, 出口管制, 对外投资, 国别指南]
        cadence: event
        access_notes: 国别风险需结合目标市场官方原文
      - id: safe
        name: 国家外汇管理局
        url: https://www.safe.gov.cn/
        authority: official
        use_for: [跨境收付, 外汇政策, 国际收支]
        cadence: event
        access_notes: 区分经常项目、资本项目和银行执行口径
      - id: tax
        name: 国家税务总局
        url: https://www.chinatax.gov.cn/
        authority: official
