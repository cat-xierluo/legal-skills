# 外部数据根:个人运行时数据(runtime/review/proposals/panel/audit/migrations)的存放根目录。
#
# 这是 example。复制为 config/data_root.yaml 后按需修改:
#   cp config/data_root.example.yaml config/data_root.yaml
#
# 优先级:环境变量 SELF_EVOLVE_DATA_ROOT > 本文件 data_root > 平台默认。
#   - 留空(data_root: "")= 用平台默认,无需改动:
#       macOS: ~/Library/Application Support/maoscripts/state/self-evolve
#       Linux: ~/.local/state/self-evolve (或 $XDG_STATE_HOME/self-evolve)
#   - 想自定义:填绝对路径,如 data_root: "<your-home>/self-evolve-data"
#   - 临时覆盖:export SELF_EVOLVE_DATA_ROOT=/path(优先级最高)
#
# 首次运行只认领不存在或空目录,并写入 .self-evolve-root.json 绑定;拒绝 / 、用户主目录、
# 系统临时目录(如 /tmp)以及非空但未认领的目录。
data_root: ""
