  <g font-family="{{diagramFont}}" font-size="{{fontSize}}" fill="{{text}}">
    <rect x="5" y="12" width="185" height="142" rx="{{radius}}" fill="{{cream}}" stroke="{{primary}}" stroke-width="{{strokeWidth}}"/>
    <rect x="210" y="12" width="185" height="142" rx="{{radius}}" fill="{{card}}" stroke="{{gold}}" stroke-width="{{strokeWidth}}"/>
    <rect x="415" y="12" width="185" height="142" rx="{{radius}}" fill="{{cream}}" stroke="{{primary}}" stroke-width="{{strokeWidth}}"/>
    <g fill="{{primary}}" font-weight="bold"><text x="21" y="43">01 · 沟通目标</text><text x="226" y="43">02 · 核对资料</text><text x="431" y="43">03 · 确认安排</text></g>
    <text x="21" y="76">识别拟解决的问题</text><text x="21" y="106">说明现有信息与缺口</text><text x="226" y="76">按来源核对材料</text><text x="226" y="106">保留待核事项</text><text x="431" y="76">协商具体服务范围</text><text x="431" y="106">确定后再推进工作</text>
