# 同步白名单（双平台分流：ClawHub + 腾讯 SkillHub）示例模板
# ─────────────────────────────────────────────────────
# 这是模板文件（.example.yaml），供其他用户参考。
# 你的真实配置请复制为 sync-allowlist.yaml（去掉 .example）后按需调整。
# 真实配置文件已被 .gitignore 排除，不会提交。
# ─────────────────────────────────────────────────────
#
# 【分流策略：一个 skill 只发一个平台，不重复分发】
#   - ClawHub（MIT-0）：通用工具类主阵地。已发 ClawHub 的不再发 SkillHub。
#   - SkillHub：留给 ClawHub 收不了的 —— CC-BY-NC 法律类、ClawHub slug 冲突的。
#   platforms 二选一：[clawhub] 或 [skillhub]，不再写 [clawhub, skillhub]。
#
# 字段说明：
#   platforms    - 目标平台（单选：clawhub 或 skillhub）
#   license      - 该 skill 实际采用的许可证（标注用，不参与逻辑）
#   display_name - 仅 skillhub 需要（SkillHub 展示名，发布时由 prepare-publish.sh
#                  注入临时副本 SKILL.md frontmatter；源 SKILL.md 不含此字段）
#   slug         - 可选。slug 重名/被占用时覆盖（默认 = skill 目录名）

# ===== MIT 通用工具 → ClawHub =====
md2word:
  platforms: [clawhub]              # MIT
de-ai-polish:
  platforms: [clawhub]              # MIT
git-batch-commit:
  platforms: [clawhub]              # MIT

# ===== CC-BY-NC 法律类 → SkillHub（ClawHub 强制 MIT-0，冲突不收）=====
legal-qa-extractor:
  platforms: [skillhub]             # CC-BY-NC
  display_name: "法律问答知识提取"
patent-analysis:
  platforms: [skillhub]             # CC-BY-NC
  display_name: "专利结构化分析"
trademark-assistant:
  platforms: [skillhub]             # CC-BY-NC
  display_name: "商标申请辅助"

# ===== slug 冲突示例 =====
# some-skill:
#   platforms: [skillhub]           # ClawHub slug 被占用，改发 SkillHub
#   display_name: "某技能中文名"
#   slug: some-skill-v2             # SkillHub 也冲突时覆盖 slug

# ===== 暂不发布（注释掉即可）=====
#  video-compressor:
#    platforms: [skillhub]
