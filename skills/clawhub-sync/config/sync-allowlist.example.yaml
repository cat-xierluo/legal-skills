  display_name: "多源搜索"
repo-research:
  platforms: [clawhub, skillhub]
  display_name: "仓库研究"

# ===== 媒体处理 =====
svg-article-illustrator:
  platforms: [clawhub, skillhub]
  display_name: "SVG 文章配图生成"
funasr-transcribe:
  platforms: [clawhub, skillhub]
  display_name: "FunASR 语音转文字"
wechat-article-fetch:
  platforms: [clawhub, skillhub]
