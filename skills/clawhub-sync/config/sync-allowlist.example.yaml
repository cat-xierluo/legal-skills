# ===== 效率工具 =====
skill-lint:
  platforms: [clawhub, skillhub]
  display_name: "Skill 质量验收与审查"
skill-manager:
  platforms: [clawhub, skillhub]
  display_name: "Skill 安装管理"
git-batch-commit:
  platforms: [clawhub, skillhub]
  display_name: "Git 批量提交拆分"
# slug 冲突示例：当 skill 目录名在平台已被占用时，用 slug 字段覆盖
# some-skill:
#   platforms: [skillhub]
#   display_name: "某技能中文名"
#   slug: some-skill-v2            # 默认 slug(some-skill)被占用，改用 -v2

