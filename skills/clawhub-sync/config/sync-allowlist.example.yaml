  display_name: "MinerU 文档解析"
piclist-upload:
  platforms: [clawhub, skillhub]
  display_name: "图床上传"
de-ai-polish:
  platforms: [clawhub, skillhub]
  display_name: "AI 腔检测与去除"

# ===== 搜索与研究 =====
multi-search:
