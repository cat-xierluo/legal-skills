# 同步白名单（腾讯 SkillHub 平台独立列表）— 公开模板
# ─────────────────────────────────────────────────────
# 这是模板文件（.example.yaml），供其他用户参考。
# 你的真实配置请复制为 allowlist-skillhub.yaml（去掉 .example）后按需调整。
# 真实配置文件已被 .gitignore 排除，不会提交。
# ─────────────────────────────────────────────────────
#
# 【v1.7.1 三份独立列表架构】
# clawhub-sync 从 v1.7.0「单一嵌套文件 + platforms 字段」反转为
# 三份独立列表文件：allowlist-clawhub.yaml / allowlist-skillhub.yaml / allowlist-lenovo.yaml
# 每份文件只列该平台的 skill 名,字段独立维护。同一 skill 可跨多份文件（一对多）,
# 不再受「三选一」约束。详见 DECISIONS D-2026-08-12-02。
#
# 本文件结构:
#   - 顶层是 skill 名（kebab-case,2-128 字符）
#   - 子层是平台特定字段（display_name 必填;slug 可选,重名/被占用时覆盖）
#   - 无 platforms 字段（与单一嵌套结构的关键差异）
#
# 字段说明:
#   display_name - **必填**（SkillHub 展示名,中文名,发布前由 prepare-publish.sh 注入
#                  临时副本 SKILL.md frontmatter;源 SKILL.md 不含此字段,缺则 fail-closed）
#   slug         - 可选。SkillHub 的 slug 字段,重名/被占用时覆盖
#                  默认 = skill 目录名（即 name）
#
# 发布命令:
#   skillhub publish /tmp/skillhub-publish-<skill> \
#     --version "<版本号>" --changelog "<变更说明>"

