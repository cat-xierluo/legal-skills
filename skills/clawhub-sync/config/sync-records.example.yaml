# 同步记录（双平台：ClawHub + 腾讯 SkillHub）示例模板
# ─────────────────────────────────────────────────────
# 这是模板文件（.example.yaml），供其他用户参考。
# 你的真实配置请复制为 sync-records.yaml（去掉 .example）后填入实际数据。
# 真实配置文件已被 .gitignore 排除，不会提交，可安全写入 publish_id 等内部数据。
# ─────────────────────────────────────────────────────
#
# 顶层结构：records.<skill>.platforms.<platform>.<field>
#
# 记录字段：
#   version          - 同步时的版本号
#   last_sync        - 最后同步时间 (ISO 8601)
#   git_hash         - 同步时的 commit hash
#   status           - synced / pending / failed / slug_conflict / skipped / deleted
#   changelog_summary- 变更摘要
#   url              - 平台发布地址
#   publish_id       - 平台内部 ID
#   namespace        - SkillHub 命名空间（账号绑定，发布时无需命令行传参；发布前替换 <your-namespace> 为你的实际空间名）
#
# 注：腾讯 SkillHub 的 namespace 绑定在账号上（服务端 @<namespace>/<slug> 格式），
#     发布命令本身不传 namespace，但记录中保留便于溯源安装命令（skillhub install <slug> --namespace <xxx>）。

records:
  legal-qa-extractor:
    platforms:
      clawhub:
        version: null
        status: skipped
        changelog_summary: CC-BY-NC 与 ClawHub MIT-0 冲突，不发布
      skillhub:
        namespace: <your-namespace>
        version: null
        last_sync: null
        git_hash: null
        status: pending
        changelog_summary: null
