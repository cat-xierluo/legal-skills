  <desc id="seq-desc">每张小纸片表示一个实际修订或批注写入批次。意见 A 的三批逐个留下，意见内顺延一至二分钟；随后经过五至十分钟的大间隔，再形成意见 B 的三批。距离不是实际耗时比例。周期末仅清除本轮演示并重新播放，不表示删除已写入的批注。</desc>
