<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="flow-title">
<title id="flow-title">输入、处理与结果</title>
<rect width="600" height="240" fill="#f1f5f8" data-layout-id="background" data-layout-role="background"/>
<defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#36516a"/></marker></defs>
<g font-family="sans-serif" font-size="26" text-anchor="middle">
<rect x="30" y="70" width="140" height="100" fill="#d9e9f5" data-layout-id="input" data-layout-role="container"/>
<text x="100" y="130" data-layout-id="input-label" data-layout-within="input">输入</text>
<line x1="180" y1="120" x2="222" y2="120" stroke="#36516a" stroke-width="3" marker-end="url(#flow-arrow)" data-layout-id="link-a"/>
<rect x="230" y="70" width="140" height="100" fill="#dceee3" data-layout-id="process" data-layout-role="container"/>
<text x="300" y="130" data-layout-id="process-label" data-layout-within="process">处理</text>
<line x1="380" y1="120" x2="422" y2="120" stroke="#36516a" stroke-width="3" marker-end="url(#flow-arrow)" data-layout-id="link-b"/>
<rect x="430" y="70" width="140" height="100" fill="#f3e5d3" data-layout-id="result" data-layout-role="container"/>
<text x="500" y="130" data-layout-id="result-label" data-layout-within="result">结果</text>
</g>
</svg>
