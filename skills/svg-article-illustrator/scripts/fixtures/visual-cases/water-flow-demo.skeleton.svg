<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="water-title water-desc">
  <title id="water-title">同量进入，不同出水节奏</title>
  <desc id="water-desc">两条路线各有三份示意水量。下路水暂留于孔隙，再依次流出；右侧接水容器保留三份水量；时钟旁的刻痕记录出水先后与疏密，不是实测流量或耗时比例。循环重演，不代表倒流。</desc>
