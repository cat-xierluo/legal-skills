  <text x="44" y="260" font-size="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#203B42" text-anchor="start">孔隙暂存</text>
  <text x="590" y="104" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#4D6B6C" text-anchor="start">出水</text>
