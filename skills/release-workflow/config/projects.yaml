folia:
  repo: cat-xierluo/Folia
  type: tauri
  auto_update: true
  windows_format: exe
  platforms:
  - macos-aarch64
  - macos-x64
  - windows-x64
  exclude_assets:
  - '*.msi'
  - '*.msi.sig'
  release_notes:
    profile: desktop-standard
    language: zh-CN
    required_sections:
    - Highlights
    - 下载
    optional_sections:
    - 新增
    - 变更
    - 修复
    always_include:
    - no_duplicate_title
    - summary_blockquote
    - full_changelog_link
    - auto_update_assets_note
    - macos_gatekeeper_warning
    - contributor_attribution
    warning:
      include_when:
      - macos_unsigned
      - terminal_command_required
      - breaking_change
      - security_notice
